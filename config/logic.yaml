service_name: Logic
weight: 10
listen_addr: 127.0.0.1:9101
advertise_addr: 127.0.0.1:9101
# 节点间 Kitex 共享密钥。环境变量 TUSERV_CLUSTER_SECRET 优先；两者都空则拒绝启动。
cluster_secret: ""
etcd:
  endpoints:
    - 127.0.0.1:2379
mongo:
  uri: mongodb://127.0.0.1:27017
  db_prefix: game_
flush_interval: 1s
# 在线角色续租间隔，必须小于租约 TTL（15s）。留空、非法、非正数或不小于 TTL 时约为 TTL 的三分之一。
# 这条循环和刷盘、网关清理分开，避免 Mongo 变慢时租约过期被别的节点接走。
renew_interval: 5s
cache:
  max_items: 20000
  idle: 10m
# 对照 etcd 里的 Gate。连续缺席 gate_misses 次后，按断线流程清掉挂在该网关上的会话。
gate_probe_interval: 5s
gate_misses: 2
# 一台失联网关同时清理的会话数。留空或非正数时为 8，避免几千个会话串行刷盘把探测拖住。
gate_reap_parallel: 8
log:
  level: info
  format: text
  dir: logs
  name: logic
  max_size_mb: 100
  max_age_days: 7
  also_stdout: true
