service_name: Logic
weight: 10
listen_addr: 127.0.0.1:9101
advertise_addr: 127.0.0.1:9101
# 节点间 Kitex 共享密钥。环境变量 TUSERV_CLUSTER_SECRET 优先；两者都空则拒绝启动。
cluster_secret: ""
etcd:
  endpoints:
    - 127.0.0.1:2379
mongo:
  uri: mongodb://127.0.0.1:27017
  db_prefix: game_
flush_interval: 1s
cache:
  max_items: 20000
  idle: 10m
# 对照 etcd 里的 Gate。连续缺席 gate_misses 次后，按断线流程清掉挂在该网关上的会话。
gate_probe_interval: 5s
gate_misses: 2
log:
  level: info
  format: text
  dir: logs
  name: logic
  max_size_mb: 100
  max_age_days: 7
  also_stdout: true
